name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: hardatlas-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-stack
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Cache uv wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'packages/py/**/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          corepack pnpm install --frozen-lockfile
          uv sync --all-packages

      - name: Install Playwright browsers
        run: corepack pnpm exec playwright install --with-deps

      - name: Run full verification stack
        run: bash scripts/verify-stack.sh
