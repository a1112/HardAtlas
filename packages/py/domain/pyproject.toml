[project]
name = "hardatlas-domain"
version = "0.1.0"
description = "Hardware Atlas shared domain contracts"
requires-python = ">=3.12"
dependencies = [
  "croniter>=6.0.0,<7",
  "pydantic>=2.11.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardatlas_domain"]
