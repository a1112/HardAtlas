[project]
name = "hardatlas-data"
version = "0.1.0"
description = "Persistence and publication boundaries"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.4",
  "asyncpg>=0.30.0",
  "hardatlas-ai",
  "hardatlas-domain",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.9",
  "sqlalchemy[asyncio]>=2.0.43",
]

[tool.uv.sources]
hardatlas-ai = { workspace = true }
hardatlas-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardatlas_data"]
