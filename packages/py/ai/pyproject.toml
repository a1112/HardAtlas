[project]
name = "hardatlas-ai"
version = "0.1.0"
description = "Optional AI adapter boundaries"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "jsonschema>=4.25.1",
  "pydantic>=2.11.7",
]

[dependency-groups]
dev = ["pytest>=8.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardatlas_ai"]
