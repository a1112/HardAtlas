[project]
name = "hardatlas-ingestion"
version = "0.1.0"
description = "Source ingestion and normalization boundaries"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40.0",
  "hardatlas-domain",
  "httpx>=0.28.1",
  "pydantic>=2.11.7",
]

[tool.uv.sources]
hardatlas-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardatlas_ingestion"]
