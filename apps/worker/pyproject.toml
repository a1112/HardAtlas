[project]
name = "hardatlas-worker"
version = "0.1.0"
description = "Atlas encyclopedia background task entry point"
requires-python = ">=3.12"
dependencies = [
  "croniter>=6.0.0,<7",
  "dramatiq[redis]>=1.18.0",
  "hardatlas-ai",
  "hardatlas-data",
  "hardatlas-domain",
  "hardatlas-ingestion",
  "httpx>=0.28.1",
]

[project.scripts]
hardatlas-dispatcher = "hardatlas_worker.dispatcher:main"
hardatlas-scheduler = "hardatlas_worker.scheduler:main"

[tool.uv.sources]
hardatlas-ai = { workspace = true }
hardatlas-data = { workspace = true }
hardatlas-domain = { workspace = true }
hardatlas-ingestion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardatlas_worker"]
