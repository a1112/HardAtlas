[package]
name = "hardatlas-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hardatlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
scanner-core = { path = "../../../crates/scanner-core" }
scanner-windows = { path = "../../../crates/scanner-windows" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
window-vibrancy = "0.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSWindow", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2", "NSUserDefaults"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["UI_ViewManagement"] }
